name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-detect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Les artifacts de build sont hébergés sur Azure Blob Storage, injoignable depuis
      # certains environnements réseau restreints. On publie donc aussi l'APK comme
      # asset d'une Release GitHub, téléchargeable directement via github.com.
      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "Cloud Detect APK - build ${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install app on emulator and capture logcat around launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # Accorde la permission caméra AVANT le lancement pour exercer le vrai chemin
            # de code CameraX + TFLite (jamais atteint si on laisse la boîte de dialogue
            # sans réponse, ce qui a fait passer à côté du crash réel la première fois).
            adb shell pm grant com.clouddetect.app android.permission.CAMERA
            adb shell am start -n com.clouddetect.app/.MainActivity
            sleep 20
            echo "===== APP PROCESS STATUS (absent = a probablement crashé) ====="
            adb shell "ps -A | grep clouddetect" || echo "Process clouddetect introuvable."
            echo "===== APP-TAGGED LOGCAT (tous les tags émis par notre process, y compris messages d'exception) ====="
            adb logcat -d --pid=$(adb shell pidof com.clouddetect.app) || echo "Impossible de filtrer par pid (process absent ?)."
            echo "===== CRASH SUMMARY (grep large) ====="
            adb logcat -d | grep -iE "FATAL EXCEPTION|AndroidRuntime|CameraScreen|CloudClassifier|clouddetect|Caused by|Exception:|Error:|Process.*com.clouddetect" || echo "No crash markers found in logcat."
